[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-accountant"
version = "0.1.2"
description = "Corporation wallet history and monthly profit-and-loss dashboards for Alliance Auth"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["allianceauth>=5,<6", "django-esi>=10,<11"]
classifiers = ["Framework :: Django :: 5.2", "Programming Language :: Python :: 3", "Environment :: Web Environment"]

[project.urls]
Homepage = "https://github.com/Redone0001/aa-accountant"
Source = "https://github.com/Redone0001/aa-accountant"
Issues = "https://github.com/Redone0001/aa-accountant/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-django>=4.8", "ruff", "build", "fakeredis"]

[tool.setuptools.packages.find]
include = ["accountant*"]

[tool.setuptools.package-data]
accountant = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"accountant/migrations/*" = ["E501"]

